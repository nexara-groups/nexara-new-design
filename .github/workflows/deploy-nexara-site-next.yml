name: One-time approved Nexara release

on:
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Existing Worker version UUID to restore; leave empty to publish the approved preview"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-nexara-site-next
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ca93de7853e49bb397e5a95ca6c01a03

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexara-site
    steps:
      - name: Checkout approved release branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexara-site/package-lock.json

      - name: Install dependencies
        if: inputs.rollback_version == ''
        run: npm ci

      - name: Verify and build approved site
        if: inputs.rollback_version == ''
        run: |
          npm test
          npm run build
          npm run check:seo

      - name: Record preceding deployment for rollback
        if: inputs.rollback_version == ''
        run: npx --yes wrangler@4.90.0 deployments list --config wrangler.json --json | tee /tmp/nexara-pre-release-deployments.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Save rollback metadata
        if: inputs.rollback_version == ''
        uses: actions/upload-artifact@v4
        with:
          name: nexara-pre-release-${{ github.run_id }}
          path: /tmp/nexara-pre-release-deployments.json
          retention-days: 30

      - name: Deploy approved preview to nexaragroups.com
        if: inputs.rollback_version == ''
        run: npx --yes wrangler@4.90.0 deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify live release
        if: inputs.rollback_version == ''
        run: node scripts/verify-live.mjs

      - name: Restore selected previous Worker version
        if: inputs.rollback_version != ''
        run: |
          [[ "$ROLLBACK_VERSION" =~ ^[a-fA-F0-9-]{36}$ ]]
          npx --yes wrangler@4.90.0 rollback "$ROLLBACK_VERSION" --yes --config wrangler.json
        env:
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
