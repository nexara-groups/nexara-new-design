name = "nexara-site"
main = ".open-next/worker.js"
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]
account_id = "ca93de7853e49bb397e5a95ca6c01a03"

routes = [
  { pattern = "nexaragroups.com/*", zone_name = "nexaragroups.com" },
  # www is served by this Worker only to 301 it to the apex (see src/middleware.ts).
  { pattern = "www.nexaragroups.com/*", zone_name = "nexaragroups.com" },
  # Brand alias domains: served only to 301 to nexaragroups.com (see ALIAS_HOSTS in src/middleware.ts).
  # The apex hostnames are already attached to this Worker in the dashboard.
  { pattern = "www.nexaraprivatelimited.in/*", zone_name = "nexaraprivatelimited.in" },
  { pattern = "www.nexaraprivatelimited.com/*", zone_name = "nexaraprivatelimited.com" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# Next.js owns redirects; keep public legal files at their declared canonical URLs.
html_handling = "none"
